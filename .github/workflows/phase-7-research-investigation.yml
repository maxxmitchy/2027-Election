name: Phase 7 Research Investigation & Dossier Assembly
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  phase-7:
    name: research-investigation-dossier
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: retrieval_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d retrieval_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retrieval_test
      PGPASSWORD: postgres
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.14"}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize reference database
        run: psql -h 127.0.0.1 -U postgres -d retrieval_test -f db/round5_reference.sql
      - name: Record exact execution identity
        run: |
          mkdir -p evidence/phase-7
          printf 'implementation_sha=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" | tee evidence/phase-7/implementation-sha.txt
          printf 'github.sha=%s\n' "$GITHUB_SHA" | tee evidence/phase-7/github-sha.txt
          printf 'tested_sha=%s\n' "$(git rev-parse HEAD)" | tee evidence/phase-7/sha.txt
          printf 'workflow=.github/workflows/phase-7-research-investigation.yml\nrun_id=%s\n' "$GITHUB_RUN_ID" | tee evidence/phase-7/execution.txt
          python --version | tee evidence/phase-7/versions.txt
          psql --version >> evidence/phase-7/versions.txt
          python -m pip freeze >> evidence/phase-7/versions.txt
      - name: Run Phase 3 regression
        id: phase3
        continue-on-error: true
        run: python -m pytest -q tests/test_query_interpreter.py tests/query_semantics.py tests/test_system_demo.py tests/test_answer_experience.py tests/test_phase3_golden.py | tee evidence/phase-7/phase3.txt
      - name: Run Phase 4 regression
        id: phase4
        continue-on-error: true
        run: python -m pytest -q tests/test_phase4_*.py tests/gate4_candidate_acceptance.py tests/gate4_postgres_runtime.py | tee evidence/phase-7/phase4.txt
      - name: Run Phase 5 regression
        id: phase5
        continue-on-error: true
        run: python -m pytest -q tests/test_phase5_research_workbench.py | tee evidence/phase-7/phase5.txt
      - name: Run Phase 6 regression
        id: phase6
        continue-on-error: true
        run: python -m pytest -q tests/test_phase6_evidence_acquisition.py | tee evidence/phase-7/phase6.txt
      - name: Run Phase 7 investigation and dossier tests
        id: phase7tests
        continue-on-error: true
        run: python -m pytest -q tests/test_phase7_dossier.py | tee evidence/phase-7/phase7-tests.txt
      - name: Run Phase 7 assembly
        id: assembly
        continue-on-error: true
        run: PYTHONPATH=. python scripts/run_phase7_assembly.py | tee evidence/phase-7/assembly.txt
      - name: Run Phase 7 mutation audit
        id: mutations
        continue-on-error: true
        run: PYTHONPATH=. python scripts/run_phase7_mutation_audit.py | tee evidence/phase-7/mutations.txt
      - name: Validate JSON Schemas
        id: schemas
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for name in ['research-investigation.schema.json','dossier.schema.json','dossier-claim.schema.json','dossier-diff.schema.json','dossier-snapshot.schema.json','review-queue.schema.json']:
              Draft202012Validator.check_schema(json.loads((Path('schemas')/name).read_text()))
          print('SCHEMA_VALIDATION_OK')
          PY
      - name: Verify candidate isolation and blocked corpus
        id: isolation
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from phase7_dossier import CANDIDATES, BLOCKED
          b=json.loads(Path('reports/phase-7-dossier-assembly.json').read_text())
          assert b['candidate_4']==BLOCKED
          assert set(b['candidate_scope'])==set(CANDIDATES)
          assert BLOCKED not in b['candidate_scope']
          for cid,d in b['dossiers'].items():
              assert cid in CANDIDATES
              assert all(c['candidate_id']==cid for c in d['claims'])
          print('CANDIDATE_ISOLATION_OK')
          PY
      - name: Verify historical as_of and V1 V2 controls
        id: historical
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('reports/phase-7-historical-rebuild.json').read_text())
          assert h['as_of_2023']['as_of']=='2023-12-31'
          assert h['as_of_2026']['as_of']=='2026-08-30'
          x=json.loads(Path('reports/phase-7-dossier-diff.json').read_text())
          assert x['from_version']==1 and x['to_version']==2
          assert x['ADDED_EVIDENCE'] or x['CHANGED_CLAIMS']
          print('HISTORICAL_AND_VERSION_CONTROLS_OK')
          PY
      - name: Verify reports and failure evidence
        id: evidence
        if: always()
        continue-on-error: true
        run: |
          test -s reports/phase-7-research-investigation.json
          test -s reports/phase-7-dossier-assembly.json
          test -s reports/phase-7-dossier-diff.json
          test -s reports/phase-7-review-queue.json
          test -s reports/phase-7-mutation-results.json
          test -s evidence/phase-7/implementation-sha.txt
          test -s evidence/phase-7/sha.txt
      - name: Generate execution report
        id: report
        if: always()
        env:
          P3: ${{ steps.phase3.outcome }}
          P4: ${{ steps.phase4.outcome }}
          P5: ${{ steps.phase5.outcome }}
          P6: ${{ steps.phase6.outcome }}
          P7: ${{ steps.phase7tests.outcome }}
          ASM: ${{ steps.assembly.outcome }}
          MUT: ${{ steps.mutations.outcome }}
          SCH: ${{ steps.schemas.outcome }}
          ISO: ${{ steps.isolation.outcome }}
          HIST: ${{ steps.historical.outcome }}
          EVID: ${{ steps.evidence.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          outcomes={k:os.environ[k] for k in ('P3','P4','P5','P6','P7','ASM','MUT','SCH','ISO','HIST','EVID')}
          implementation=Path('evidence/phase-7/implementation-sha.txt').read_text().strip().split('=',1)[1]
          tested=Path('evidence/phase-7/sha.txt').read_text().strip().split('=',1)[1]
          muts=json.loads(Path('reports/phase-7-mutation-results.json').read_text()) if Path('reports/phase-7-mutation-results.json').exists() else {}
          report={'phase':'7','name':'Research Investigation & Dossier Assembly','implementation_sha':implementation,'tested_sha':tested,'github_sha':os.environ['GITHUB_SHA'],'workflow':'.github/workflows/phase-7-research-investigation.yml','run_id':int(os.environ['GITHUB_RUN_ID']),'job_id':os.environ['GITHUB_JOB'],'python':'3.12.14','postgresql':'16','execution':outcomes,'candidate_scope':['bola-ahmed-tinubu','peter-gregory-obi','atiku-abubakar'],'candidate_4':'BLOCKED','methodology_version':'phase7-research-investigation-dossier-v1','mutation_count':muts.get('mutation_count',0),'mutations_killed':muts.get('killed',0),'mutations_survived':muts.get('survived',0),'status':'PASS' if all(v=='success' for v in outcomes.values()) and muts.get('survived',1)==0 else 'FAILED'}
          Path('reports/phase-7-execution-report.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('reports/phase-7-execution-report.md').write_text('# Phase 7 — Execution Report\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          PY
      - name: Hash evidence and reports
        if: always()
        run: sha256sum reports/phase-7-* evidence/phase-7/* > evidence/phase-7/report-hashes.txt
      - name: Upload Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-7-evidence-${{ github.sha }}
          path: |
            reports/phase-7-*.md
            reports/phase-7-*.json
            schemas/research-investigation.schema.json
            schemas/dossier.schema.json
            schemas/dossier-claim.schema.json
            schemas/dossier-diff.schema.json
            schemas/dossier-snapshot.schema.json
            schemas/review-queue.schema.json
            evidence/phase-7/
          if-no-files-found: error
      - name: Fail closed
        if: steps.phase3.outcome != 'success' || steps.phase4.outcome != 'success' || steps.phase5.outcome != 'success' || steps.phase6.outcome != 'success' || steps.phase7tests.outcome != 'success' || steps.assembly.outcome != 'success' || steps.mutations.outcome != 'success' || steps.schemas.outcome != 'success' || steps.isolation.outcome != 'success' || steps.historical.outcome != 'success' || steps.evidence.outcome != 'success'
        run: exit 1
