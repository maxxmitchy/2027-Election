name: Phase 10 Human User Testing
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  phase-10:
    name: human-testing-protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.14"}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Record exact execution identity
        run: |
          mkdir -p evidence/phase-10
          printf 'implementation_sha=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" | tee evidence/phase-10/implementation-sha.txt
          printf 'github.sha=%s\n' "$GITHUB_SHA" | tee evidence/phase-10/github-sha.txt
          printf 'tested_sha=%s\n' "$(git rev-parse HEAD)" | tee evidence/phase-10/sha.txt
          printf 'workflow=.github/workflows/phase-10-human-testing.yml\nrun_id=%s\njob_id=%s\n' "$GITHUB_RUN_ID" "$GITHUB_JOB" | tee evidence/phase-10/execution.txt
          python --version | tee evidence/phase-10/versions.txt
      - name: Run Phase 3 regression
        run: python -m pytest -q tests/test_query_interpreter.py tests/query_semantics.py tests/test_system_demo.py tests/test_answer_experience.py tests/test_phase3_golden.py
      - name: Run Phase 4 regression
        run: python -m pytest -q tests/test_phase4_*.py tests/gate4_candidate_acceptance.py tests/gate4_postgres_runtime.py
      - name: Run Phase 5 regression
        run: python -m pytest -q tests/test_phase5_research_workbench.py
      - name: Run Phase 6 regression
        run: python -m pytest -q tests/test_phase6_evidence_acquisition.py
      - name: Run Phase 7 regression
        run: python -m pytest -q tests/test_phase7_dossier.py tests/test_phase7_investigation.py
      - name: Run Phase 8 regression
        run: python -m pytest -q tests/test_phase8_review_publication.py
      - name: Run Phase 9 regression
        run: python -m pytest -q tests/test_phase9_publication_closure.py
      - name: Run Phase 10 automated protocol tests
        run: python -m pytest -q tests/test_phase10_human_testing.py
      - name: Validate Phase 10 schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for p in Path('schemas').glob('phase10-*.schema.json'):
              Draft202012Validator.check_schema(json.loads(p.read_text()))
          print('PHASE10_SCHEMA_VALIDATION_OK')
          PY
      - name: Run Phase 10 protocol
        run: PYTHONPATH=. python scripts/run_phase10_protocol.py
      - name: Assert no fabricated human testing
        run: |
          python - <<'PY'
          import json
          r=json.load(open('reports/phase-10-human-testing.json'))
          assert r['human_test_executed'] is False
          assert r['human_sessions']==0
          assert r['candidate_4']=='BLOCKED'
          print('HUMAN_TESTING_NOT_FABRICATED_OK')
          PY
      - name: Candidate 4 exclusion
        run: |
          ! grep -R "Candidate 4" phase10.py tests/test_phase10_human_testing.py reports/phase-10-human-testing.json
      - name: Generate protocol evidence
        if: always()
        run: |
          mkdir -p evidence/phase-10
          sha256sum reports/phase-10-* schemas/phase10-* > evidence/phase-10/report-hashes.txt
      - name: Upload Phase 10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-evidence-${{ github.sha }}
          path: |
            reports/phase-10-*.md
            reports/phase-10-*.json
            schemas/phase10-*.schema.json
            evidence/phase-10/
          if-no-files-found: error
      - name: Fail closed
        if: failure()
        run: exit 1
