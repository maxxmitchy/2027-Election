name: Round 5 Integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integrity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d integrity_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integrity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_round5_runtime.py
      - name: Upload runtime findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round5-runtime-results
          path: reports/round5-test-results.json
