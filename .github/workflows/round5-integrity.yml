name: Round 7 Integrity Audit
on:
  push:
    branches: [main, round7-integrity-audit, round5-runtime-ci-2]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integrity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d integrity_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integrity_test
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Record environment
        run: |
          mkdir -p reports
          python --version > reports/environment.txt
          python -m pip freeze >> reports/environment.txt
          psql --version >> reports/environment.txt
          git rev-parse HEAD >> reports/environment.txt
      - name: Baseline runtime, schema and property tests
        run: python -m pytest -q tests/test_round7.py tests/test_round7_bitemporal.py
      - name: Mutation sensitivity audit
        if: always()
        run: python tests/run_round7_mutations.py
      - name: Verify required reports exist
        if: always()
        run: |
          test -f reports/round7-test-results.json
          test -f reports/round7-mutation-results.json
          test -f reports/invariant-coverage.md
      - name: Upload Round 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round7-integrity-evidence
          path: |
            reports/round7-test-results.json
            reports/round7-mutation-results.json
            reports/invariant-coverage.md
            reports/invariant-coverage.json
            reports/environment.txt
