name: Evidence Product
on:
  push:
    branches: [evidence-product]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  product:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: retrieval_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d retrieval_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retrieval_test
      PGPASSWORD: postgres
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize PostgreSQL reference schema
        run: psql -h 127.0.0.1 -U postgres -d retrieval_test -f db/round5_reference.sql
      - name: Record execution identity
        run: |
          mkdir -p evidence/evidence-product
          git rev-parse HEAD > evidence/evidence-product/sha.txt
          python --version > evidence/evidence-product/versions.txt
          psql --version >> evidence/evidence-product/versions.txt
          python -m pip freeze >> evidence/evidence-product/versions.txt
      - name: Run product tests
        run: python -m pytest -q tests/test_system_demo.py tests/test_evidence_product.py | tee evidence/evidence-product/pytest.txt
      - name: Run product mutation audit
        run: python tests/run_evidence_product_mutations.py | tee evidence/evidence-product/mutations.txt
      - name: Generate product reports
        run: python tools/generate_evidence_product_report.py
      - name: Hash reports
        run: sha256sum reports/evidence-product.md reports/evidence-product.json > evidence/evidence-product/report-hashes.txt
      - name: Upload evidence product evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-product-${{ github.sha }}
          path: |
            reports/evidence-product.md
            reports/evidence-product.json
            evidence/evidence-product/
