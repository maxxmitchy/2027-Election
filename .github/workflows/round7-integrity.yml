name: Round 8 Failure Artifact Probe
on:
  push:
    branches: [round8-failure-probe]

jobs:
  integrity:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integrity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d integrity_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/integrity_test
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Baseline runtime
        run: python -m pytest -q tests/test_round7.py tests/test_round7_bitemporal.py
      - name: Deliberate failure probe
        run: |
          cat > tests/_round8_failure_probe.py <<'PY'
          def test_round8_failure_probe():
              assert False, 'ROUND8_FAILURE_PROBE_INTENTIONAL'
          PY
          python -m pytest -q tests/_round8_failure_probe.py
      - name: Verify failure report
        if: always()
        run: test -f reports/round7-test-results.json
      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round8-failure-probe-${{ github.sha }}
          path: |
            reports/round7-test-results.json
            reports/environment.txt
