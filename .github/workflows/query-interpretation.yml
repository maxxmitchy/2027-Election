name: Query Interpretation
on:
  push:
    branches: [evidence-product]
  pull_request:
    branches: [evidence-product]
jobs:
  query-interpretation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: retrieval_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d retrieval_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retrieval_test
      PGPASSWORD: postgres
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.14'}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize PostgreSQL reference schema
        run: psql -h 127.0.0.1 -U postgres -d retrieval_test -f db/round5_reference.sql
      - name: Record execution identity
        run: |
          mkdir -p evidence/query-interpretation
          git rev-parse HEAD > evidence/query-interpretation/sha.txt
          python --version > evidence/query-interpretation/versions.txt
          psql --version >> evidence/query-interpretation/versions.txt
          python -m pip freeze >> evidence/query-interpretation/versions.txt
      - name: Run interpreter tests
        run: python -m pytest -q tests/test_query_interpreter.py tests/test_system_demo.py | tee evidence/query-interpretation/pytest.txt
      - name: Run mutation audit
        run: python tests/run_query_interpretation_mutations.py | tee evidence/query-interpretation/mutations.txt
      - name: Validate schema and reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('schemas/query.schema.json').read_text())
          sample=json.loads(__import__('json').dumps(__import__('query_interpreter').interpret_and_validate('How many votes did Tinubu get in 2023?')))
          Draft202012Validator(schema).validate({k:v for k,v in sample.items() if k!='validation'})
          for p in ['docs/query-interpretation.md','reports/query-interpretation-demo.md','reports/query-interpretation-validation.md','reports/query-interpretation-validation.json']:
              assert Path(p).exists(), p
          PY
      - name: Generate validation report identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/query-interpretation-validation.json')
          x=json.loads(p.read_text())
          x['tested_sha']=Path('evidence/query-interpretation/sha.txt').read_text().strip()
          x['ci_status']='PASS'
          p.write_text(json.dumps(x,indent=2)+'\n')
          PY
      - name: Hash reports
        run: sha256sum reports/query-interpretation-validation.md reports/query-interpretation-validation.json > evidence/query-interpretation/report-hashes.txt
      - name: Upload query interpretation evidence
        uses: actions/upload-artifact@v4
        with:
          name: query-interpretation-${{ github.sha }}
          path: |
            reports/query-interpretation-validation.md
            reports/query-interpretation-validation.json
            reports/query-interpretation-demo.md
            docs/query-interpretation.md
            schemas/query.schema.json
            evidence/query-interpretation/
