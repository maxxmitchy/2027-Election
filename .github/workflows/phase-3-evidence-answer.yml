name: Phase 3 Evidence Answer Experience
on:
  push:
    branches: ["query-interpretation"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  phase-3:
    name: evidence-answer
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: retrieval_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d retrieval_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retrieval_test
      PGPASSWORD: postgres
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.14"}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize PostgreSQL reference schema
        run: psql -h 127.0.0.1 -U postgres -d retrieval_test -f db/round5_reference.sql
      - name: Record execution identity
        run: |
          mkdir -p evidence/phase-3
          git rev-parse HEAD | tee evidence/phase-3/sha.txt
          python --version | tee evidence/phase-3/versions.txt
          psql --version >> evidence/phase-3/versions.txt
          python -m pip freeze >> evidence/phase-3/versions.txt
      - name: Run Phase 3 golden and presentation tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q tests/test_query_interpreter.py tests/query_semantics.py tests/test_system_demo.py tests/test_answer_experience.py tests/test_phase3_golden.py | tee evidence/phase-3/pytest.txt
      - name: Run Phase 3 mutation audit
        id: mutations
        continue-on-error: true
        run: |
          set -o pipefail
          python tests/run_phase3_mutations.py | tee evidence/phase-3/mutations.txt
      - name: Generate deterministic answer demo
        if: always()
        run: python reports/phase-3-answer-demo.py
      - name: Generate machine-readable validation report
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          MUTATION_OUTCOME: ${{ steps.mutations.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, re
          from pathlib import Path
          try:
              jobs=json.loads(subprocess.check_output(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs","--paginate"],text=True))
              job=next((j for j in jobs.get("jobs",[]) if j.get("name")=="evidence-answer"),{})
          except Exception: job={}
          pytest=Path("evidence/phase-3/pytest.txt").read_text(errors="replace") if Path("evidence/phase-3/pytest.txt").exists() else ""
          mutations=Path("evidence/phase-3/mutations.txt").read_text(errors="replace") if Path("evidence/phase-3/mutations.txt").exists() else ""
          m=re.search(r"(\d+) passed",pytest); passed=int(m.group(1)) if m else 0
          f=re.search(r"(\d+) failed",pytest); failed=int(f.group(1)) if f else 0
          mf=re.search(r"MUTATION_SUMMARY:\s*(\d+)/(\d+) killed",mutations); killed=int(mf.group(1)) if mf else 0; total_mut=int(mf.group(2)) if mf else 18
          status="PASS" if os.environ.get("TEST_OUTCOME")=="success" and os.environ.get("MUTATION_OUTCOME")=="success" and killed==total_mut else "FAIL"
          report={"phase":"3","name":"Evidence Answer Experience","status":status,"tested_commit":Path("evidence/phase-3/sha.txt").read_text().strip(),"workflow":".github/workflows/phase-3-evidence-answer.yml","run_id":int(os.environ["GITHUB_RUN_ID"]),"job_id":job.get("id"),"job_name":job.get("name"),"environment":{"postgresql":"16.15","python":"3.12.14"},"tests":{"count":passed+failed,"passed":passed,"failed":failed},"mutations":{"count":total_mut,"killed":killed,"survived":total_mut-killed},"candidate_scope":["bola-ahmed-tinubu","peter-gregory-obi","atiku-abubakar"],"candidate_4":"BLOCKED","golden_questions":24,"provenance":"tested through answer contract and database snapshot","quantitative":"calculation lineage and unit checks","causal":"causal questions remain conservative","contradictions":"preserved","corrections":"preserved","as_of":"preserved in interpreted query and answer contract","review_separation":"review marked NOT_A_SOURCE","negative_knowledge":"distinct status states preserved","limitations":["Presentation remains limited to semantic routes already supported by the deterministic retrieval engine.","This phase does not claim unrestricted natural-language research or production readiness."],"known_failures":[] if status=="PASS" else ["See pytest.txt and mutations.txt for failure evidence."]}
          Path("reports/phase-3-evidence-answer-experience.json").write_text(json.dumps(report,indent=2)+"\n")
          Path("reports/phase-3-evidence-answer-experience.md").write_text("# Phase 3 — Evidence Answer Experience Validation\n\n"+json.dumps(report,indent=2)+"\n")
          PY
      - name: Validate answer schema and reports
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from answer_experience import present
          schema=json.loads(Path('schemas/answer.schema.json').read_text()); Draft202012Validator(schema).validate(present('How many votes did Tinubu get in 2023?'))
          report=json.loads(Path('reports/phase-3-evidence-answer-experience.json').read_text()); assert report['tested_commit']==Path('evidence/phase-3/sha.txt').read_text().strip(); assert report['candidate_4']=='BLOCKED'; assert Path('reports/phase-3-evidence-answer-demo.md').exists()
          PY
      - name: Hash validation reports
        if: always()
        run: sha256sum reports/phase-3-evidence-answer-experience.md reports/phase-3-evidence-answer-experience.json reports/phase-3-evidence-answer-demo.md > evidence/phase-3/report-hashes.txt
      - name: Upload Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-evidence-${{ github.sha }}
          path: |
            reports/phase-3-evidence-answer-experience.md
            reports/phase-3-evidence-answer-experience.json
            reports/phase-3-evidence-answer-demo.md
            docs/answer-experience.md
            docs/phase-3-public-milestone.md
            schemas/answer.schema.json
            evidence/phase-3/
          if-no-files-found: error
      - name: Fail CI if Phase 3 validation failed
        if: steps.tests.outcome != 'success' || steps.mutations.outcome != 'success'
        run: exit 1
