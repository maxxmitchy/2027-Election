<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate Evidence Profile</title><style>body{font:15px/1.55 system-ui;margin:0;background:#fafaf8;color:#171717}main{max-width:900px;margin:auto;padding:35px 20px}a{color:#173f5f}.card{background:white;border:1px solid #ddd;border-radius:9px;padding:20px;margin:15px 0}.row{padding:11px 0;border-top:1px solid #eee}.muted{color:#6b6b6b;font-size:13px}.mono{font:12px monospace}</style></head><body><main><a href="/">← ASK THE EVIDENCE</a><div id="app" class="card">Loading evidence profile…</div></main><script>const id=new URLSearchParams(location.search).get('id');fetch('/api/candidate?id='+encodeURIComponent(id||'' )).then(r=>r.json()).then(render);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rows(title,items){if(!items?.length)return '';return `<div class="card"><h3>${title}</h3>${items.map(x=>`<div class="row"><b>${esc(x.label)}</b><div class="muted">${esc(x.date||'date not recorded')} · ${esc(x.type||'record')} · <span class="mono">${esc(x.id)}</span></div></div>`).join('')}</div>`}function render(d){if(d.error){document.getElementById('app').innerHTML='<b>Unknown candidate.</b>';return}document.getElementById('app').innerHTML=`<h1>${esc(d.name)}</h1><p class="muted">Evidence-first profile. This is a research record, not a campaign biography.</p><p><b>${d.counts.claims}</b> claims · <b>${d.counts.evidence}</b> evidence records · <b>${d.counts.sources}</b> sources · <b>${d.counts.observations}</b> observations</p>`+rows('Office history',d.office_history)+rows('Party history',d.party_history)+rows('Election history',d.election_history)+rows('Chronological evidence timeline',d.timeline)}</script></body></html>
