<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASK THE EVIDENCE</title>
<style>
:root{--ink:#171717;--muted:#6b6b6b;--line:#dedede;--paper:#fafaf8;--panel:#fff;--accent:#173f5f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:980px;margin:0 auto;padding:42px 22px 80px}header{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:28px}h1{font-size:30px;letter-spacing:.08em;margin:0 0 5px}h2{font-size:20px;margin:0 0 12px}h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px;color:var(--muted)}.tag{color:var(--accent);font-weight:700;letter-spacing:.05em}.query{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}select,input,textarea,button{font:inherit;width:100%;border:1px solid #cfcfcf;border-radius:7px;padding:10px;background:#fff}textarea{min-height:100px;resize:vertical}button{margin-top:14px;background:var(--ink);color:#fff;border-color:var(--ink);cursor:pointer;font-weight:700}.examples{margin-top:14px;color:var(--muted);font-size:13px}.examples button{display:inline-block;width:auto;margin:6px 5px 0 0;background:#fff;color:var(--ink);border-color:var(--line);font-weight:500}.answer{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.top{padding:22px;border-bottom:1px solid var(--line)}.status{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;border:1px solid var(--line);border-radius:99px;padding:3px 8px;margin-top:7px}.section{padding:18px 22px;border-bottom:1px solid var(--line)}.section:last-child{border:0}.value{white-space:pre-wrap}.evidence-item{padding:12px 0;border-top:1px solid #eee}.evidence-item:first-child{border-top:0}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#555;word-break:break-all}.lineage{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.node{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff}.arrow{color:#999}.hidden{display:none}.small{font-size:12px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding-top:25px}}
</style></head>
<body><main>
<header><h1>ASK THE EVIDENCE</h1><div class="tag">WHAT DOES THE EVIDENCE ACTUALLY ESTABLISH?</div><p class="small">A deterministic research interface over the validated evidence database. Answers are assembled from records first; technical provenance is available on demand.</p></header>
<section class="query"><div class="grid"><div><label for="candidate">CANDIDATE SCOPE</label><select id="candidate"><option value="all">All validated candidates</option><option>Tinubu</option><option>Peter Obi</option><option>Atiku</option></select></div><div><label for="asof">AS OF (OPTIONAL)</label><input id="asof" type="date"></div></div><div style="margin-top:14px"><label for="question">QUESTION</label><textarea id="question" placeholder="Ask a supported research question…"></textarea></div><button onclick="ask()">ASK</button><div class="examples"><b>Try a demonstrated question:</b><div id="examples"></div></div></section>
<section id="result" class="answer hidden"></section>
</main>
<script>
let catalog=[];fetch('/api/questions').then(r=>r.json()).then(x=>{catalog=x.questions;renderExamples()});
function renderExamples(){document.getElementById('examples').innerHTML=catalog.slice(0,8).map(q=>`<button onclick='pick(${JSON.stringify(q.question)})'>${escapeHtml(q.question)}</button>`).join('')}
function pick(q){document.getElementById('question').value=q;window.scrollTo({top:0,behavior:'smooth'})}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function esc(v){return escapeHtml(typeof v==='string'?v:JSON.stringify(v,null,2))}
function section(title,body){if(body===undefined||body===null||body===''||(Array.isArray(body)&&!body.length))return '';return `<div class="section"><h3>${title}</h3><div class="value">${typeof body==='string'?esc(body):esc(body)}</div></div>`}
function evidence(items){if(!items||!items.length)return '';return `<div class="section"><h3>Evidence</h3>${items.map(x=>`<div class="evidence-item">${esc(x.claim||x.statement||x.office||x.party||x)}<div class="small">${x.source_id?'Source: '+esc(x.source_id):''} ${x.id?' · Record: '+esc(x.id):''}</div></div>`).join('')}</div>`}
function provenance(a){let nodes=[];for(const [k,label] of [['claim_versions','CLAIM'],['evidence_versions','EVIDENCE'],['source_versions','SOURCE'],['observation_versions','OBSERVATION'],['calculation_versions','CALCULATION'],['analysis_versions','ANALYSIS'],['result_versions','RESULT'],['methodology_versions','METHODOLOGY']])if(a[k]?.length)nodes.push(`<span class="node"><b>${label}</b><br><span class="mono">${esc(a[k].join('\n'))}</span></span>`);return nodes.length?`<div class="section"><h3>Provenance</h3><div class="lineage">${nodes.join('<span class="arrow">→</span>')}</div><p class="small">Database snapshot: <span class="mono">${esc(a.database_snapshot||'not recorded')}</span></p></div>`:''}
function ask(){const q=document.getElementById('question').value.trim();if(!q)return;const c=document.getElementById('candidate').value;const d=document.getElementById('asof').value;const url='/api/query?question='+encodeURIComponent(q)+'&candidate='+encodeURIComponent(c)+(d?'&as_of='+encodeURIComponent(d):'');fetch(url).then(r=>r.json()).then(render)}
function render(a){const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<div class="top"><h2>${esc(a.answer_text||'No answer')}</h2><span class="status">${esc(a.answer_status||'UNKNOWN')}</span><div class="small" style="margin-top:8px">Scope: ${esc((a.candidate_scope||[]).join(', ')||'unspecified')} · As of: ${esc(a.as_of||'not specified')}</div></div>`+section('Key evidence',a.key_evidence)+section('What the evidence establishes',a.what_evidence_establishes)+section('What it does not establish',a.what_evidence_does_not_establish)+section('Contradictions / qualifications',a.contradictions_qualifications)+section('Calculation',a.calculation)+evidence(a.key_evidence)+section('Review',a.review_status)+provenance(a)+section('Limitations',a.limitations);r.scrollIntoView({behavior:'smooth',block:'start'})}
</script></body></html>
